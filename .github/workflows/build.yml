name: Build and Sign Android Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      # Automatyczne podpisanie kluczem Keystore (jeśli dodano sekrety w GitHubie)
      - name: Sign Android Release AAB
        if: env.SIGNING_KEY != ''
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > release.keystore
          for aab in android/app/build/outputs/bundle/release/*.aab; do
            if [ -f "$aab" ]; then
              echo "Podpisywanie paczki $aab kluczem Keystore (jarsigner)..."
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore release.keystore \
                -storepass "$KEYSTORE_PASSWORD" \
                -keypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
                "$aab" "$KEY_ALIAS"
            fi
          done
          rm -f release.keystore

      # Upload gotowej (podpisanej lub surowej) paczki AAB
      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release-signed
          path: |
            android/app/build/outputs/bundle/release/*.aab
